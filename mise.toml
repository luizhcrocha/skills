[tasks.sync-upstream]
description = "Sync the upstreams in upstreams.toml (mattpocock/skills, pstack), keeping local changes. Flags: --dry-run, --upstream NAME, --list-unmapped"
run = "bash scripts/sync-upstream.sh"

[tasks.test-scripts]
description = "Test the repo scripts (sync-upstream) against throwaway git repos"
run = "python3 -m unittest discover -s scripts/tests -v"
