<title>Fleet Board</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e1b4b'/%3E%3Cpath d='M32 33L15 19M32 33l17-14M32 33v18' stroke='%23a5b4fc' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='15' cy='19' r='7' fill='%23818cf8'/%3E%3Ccircle cx='49' cy='19' r='7' fill='%23818cf8'/%3E%3Ccircle cx='32' cy='51' r='7' fill='%23818cf8'/%3E%3Ccircle cx='32' cy='33' r='10' fill='%23eef2ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* The fleet's ledger: pale ruled paper, green-black ink, and colour only where it says a state.
     Amber waits on the viewer, red is blocked, blue is running, green is done. One family of type,
     set narrow for names, figures and tabs so a phone line holds more, and at its normal width for
     reading. The monospace is for paths and commands. */
  :root {
    --bg: #eff3ee;
    --card: #fbfcfa;
    --card-2: #e5ebe4;
    --text: #16211c;
    --muted: #55635b;
    --faint: #8a968e;
    --line: #d2dbd3;
    --accent: #0e6b55;
    --accent-soft: #d8ebe2;
    --on-accent: #ffffff;
    --you: #9a5200;
    --you-soft: #f6e7cf;
    --run: #1f5fbf;
    --run-soft: #dce7f8;
    --good: #2c7a39;
    --warning: #9a5200;
    --serious: #b94f1a;
    --critical: #b93125;
    --critical-soft: #f7dedb;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --sans: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --narrow: 84%;
    --fs-xs: 0.8125rem;
    --fs-s: 0.875rem;
    /* The smallest target a finger gets; the desktop's mouse targets stay compact. */
    --tap: 32px;
    --dock-h: 0px;
    --top-h: 56px;
    --gutter: max(16px, calc((100% - 1088px) / 2));
    --chat-w: clamp(360px, 30vw, 440px);
    --shadow: 0 12px 32px rgb(22 33 28 / 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e1411; --card: #151c18; --card-2: #1e2823; --text: #e9efea;
      --muted: #9eaba3; --faint: #67746c; --line: #29352e;
      --accent: #56c7a6; --accent-soft: #16352c; --on-accent: #08130f;
      --you: #f0a440; --you-soft: #382910; --run: #7fb0f7; --run-soft: #172a45;
      --good: #6cc878; --warning: #f0a440; --serious: #f08a55; --critical: #f2766a; --critical-soft: #3b1a17;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --shadow: 0 12px 32px rgb(0 0 0 / 0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1411; --card: #151c18; --card-2: #1e2823; --text: #e9efea;
    --muted: #9eaba3; --faint: #67746c; --line: #29352e;
    --accent: #56c7a6; --accent-soft: #16352c; --on-accent: #08130f;
    --you: #f0a440; --you-soft: #382910; --run: #7fb0f7; --run-soft: #172a45;
    --good: #6cc878; --warning: #f0a440; --serious: #f08a55; --critical: #f2766a; --critical-soft: #3b1a17;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: 0 12px 32px rgb(0 0 0 / 0.5);
  }
  @media (max-width: 759.98px) {
    :root { --fs-xs: 0.875rem; --fs-s: 0.875rem; --dock-h: 62px; --top-h: 100px; }
  }
  @media (max-width: 759.98px), (pointer: coarse) {
    :root { --tap: 44px; }
  }

  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--top-h) + 60px); }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 0.9375rem; line-height: 1.5; margin: 0; overflow-x: clip; }
  @media (max-width: 759.98px) { body { font-size: 1rem; } }
  h1, h2, h3, h4 { margin: 0; font-weight: 700; font-stretch: var(--narrow); text-wrap: balance; }
  h2 { font-size: 1.0625rem; }
  p { margin: 0; }
  a { color: var(--accent); text-underline-offset: 2px; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  .num { font-stretch: var(--narrow); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* A worker's name, wherever it appears: one tap opens the worker. */
  .who { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); min-width: var(--tap); padding: 0 4px; margin: 0 -4px; background: none; border: 0; border-radius: 5px; cursor: pointer; font-weight: 600; font-stretch: var(--narrow); text-align: left; color: inherit; }
  .who:hover { background: var(--card-2); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; background: var(--c, var(--faint)); }

  /* A state, said in a word. */
  .pill { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 4px; font-size: var(--fs-xs); font-weight: 600; font-stretch: var(--narrow); line-height: 1.5; background: var(--card-2); color: var(--muted); white-space: nowrap; }
  .pill.running, .pill.current { background: var(--run-soft); color: var(--run); }
  .pill.done, .pill.decided { background: color-mix(in srgb, var(--good) 15%, var(--card)); color: var(--good); }
  .pill.blocked, .pill.failed, .pill.critical, .pill.blocking { background: var(--critical-soft); color: var(--critical); }
  .pill.held { background: var(--run-soft); color: var(--run); }
  .pill.open, .pill.answered, .pill.new, .pill.changed, .pill.warning { background: var(--you-soft); color: var(--you); }
  .pill.serious { background: color-mix(in srgb, var(--serious) 15%, var(--card)); color: var(--serious); }
  .pill.recommended { background: var(--accent-soft); color: var(--accent); }

  /* the page: a masthead that stays, one view at a time under it */
  .shell { min-height: 100dvh; }
  .main { min-width: 0; container: main / inline-size; }
  .masthead { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto; align-items: center; gap: 10px; min-height: var(--top-h); padding-inline: var(--gutter); box-sizing: border-box; }
  .top-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .top h1 { font-size: 1.1875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mark { width: 30px; height: 30px; flex: none; border-radius: 7px; overflow: hidden; }
  .mark svg { display: block; width: 100%; height: 100%; }
  /* A phone has no room for the name beside the switcher: the name, the status, search and the bell
     take the first row, the switcher (and the way up to the manager) the second. */
  @media (max-width: 759.98px) {
    .top { grid-template-columns: minmax(0, 1fr) auto auto; grid-auto-rows: 44px; row-gap: 4px; column-gap: 6px; padding-block: 4px; }
    .top-name { grid-column: 1; grid-row: 1; }
    #find-open { grid-column: 2; grid-row: 1; }
    #bell { grid-column: 3; grid-row: 1; }
    .top .switch { grid-column: 1 / -1; grid-row: 2; display: flex; min-width: 0; }
    .top:has(#top-manager:not([hidden])) .switch { grid-column: 1 / 3; }
    #top-manager { grid-column: 3 / -1; grid-row: 2; justify-self: end; }
    .top .switch select { flex: 1; max-width: none; min-width: 0; }
  }

  .tabs { display: flex; gap: 2px; align-items: stretch; padding-inline: calc(var(--gutter) - 12px); margin-bottom: -1px; }
  .tabs a, .tabs button { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 0; background: none; color: var(--muted); text-decoration: none; font-weight: 600; font-stretch: var(--narrow); cursor: pointer; }
  .tabs svg.i { width: 18px; height: 18px; }
  .tabs a:hover, .tabs button:hover { color: var(--text); }
  .tabs [aria-current="true"], .tabs [aria-expanded="true"] { color: var(--text); }
  .tabs [aria-current="true"]::after, .tabs [aria-expanded="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--text); }
  .tabs .to-chat { margin-left: auto; }
  /* A narrow column (the page beside the docked chat at its narrowest) packs the tabs closer, so all six fit. */
  @container main (max-width: 640px) {
    .tabs a, .tabs button { gap: 6px; padding: 0 8px; }
    .tabs [aria-current="true"]::after, .tabs [aria-expanded="true"]::after { left: 8px; right: 8px; }
  }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: var(--you); color: var(--bg); font-size: 0.75rem; font-weight: 700; font-variant-numeric: tabular-nums; display: grid; place-items: center; line-height: 1; }
  .badge.alert { background: var(--critical); }
  @media (max-width: 759.98px) {
    .tabs { position: fixed; inset: auto 0 0 0; z-index: 35; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; margin: 0; padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px)); background: var(--card); border-top: 1px solid var(--line); }
    .tabs a, .tabs button { flex-direction: column; justify-content: center; gap: 3px; min-height: var(--dock-h); padding: 0; font-size: 0.8125rem; font-stretch: 78%; }
    .tabs svg.i { width: 24px; height: 24px; }
    .tabs [aria-current="true"], .tabs [aria-expanded="true"] { color: var(--accent); }
    .tabs [aria-current="true"]::after, .tabs [aria-expanded="true"]::after { top: 0; bottom: auto; left: 24%; right: 24%; border-radius: 0 0 3px 3px; background: var(--accent); }
    .tabs .to-chat { margin-left: 0; }
    .tabs .badge { position: absolute; top: 5px; left: calc(50% + 5px); }
  }

  .wrap { box-sizing: border-box; width: 100%; max-width: 1120px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px calc(40px + var(--dock-h) + env(safe-area-inset-bottom, 0px)); display: grid; gap: 24px; min-width: 0; }
  .view { display: grid; gap: 26px; align-content: start; min-width: 0; }
  .part { display: grid; gap: 10px; align-content: start; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
  .cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; }
  @container main (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .empty { padding: 16px; color: var(--muted); }

  /* the lead: what waits on the viewer, as a sentence */
  .lead { display: grid; gap: 12px; }
  .lead-line { font-size: clamp(1.875rem, 1.3rem + 3vw, 2.75rem); line-height: 1.04; font-stretch: 76%; letter-spacing: -0.01em; max-width: 20ch; }
  .lead-detail { font-size: 1.0625rem; font-weight: 600; font-stretch: var(--narrow); margin-top: -6px; color: var(--muted); }
  .lead.blocking .lead-detail { color: var(--critical); }
  .lead.clear .lead-line { color: var(--muted); }
  .goal { max-width: 68ch; }
  .now.stale { color: var(--muted); border-left-color: var(--line); }
  .now-wrong { margin: 6px 0 0 15px; padding: 4px 10px; border-left: 3px solid var(--critical); font-size: var(--fs-s); color: var(--text); background: color-mix(in srgb, var(--critical) 8%, transparent); }
  .glance { list-style: none; margin: 6px 0 0 15px; padding: 0; font-size: var(--fs-s); color: var(--muted); max-width: 90ch; }
  .glance li { margin: 2px 0; }
  .glance b { color: var(--text); font-weight: 600; margin-right: 4px; }
  .latest { margin: 6px 0 0 15px; font-size: var(--fs-s); color: var(--text); }
  .latest ul { margin: 2px 0 0; padding-left: 16px; }
  .latest time { color: var(--muted); font-size: var(--fs-xs); margin-right: 4px; }
  .now .said { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; }
  .now { max-width: 72ch; padding: 1px 0 1px 12px; border-left: 3px solid var(--run); }
  .now b { font-stretch: var(--narrow); margin-right: 4px; }
  .lead .meta { color: var(--muted); font-size: var(--fs-s); }

  /* the fleet's totals: one ruled band of figures */
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 0 12px; margin: 0; padding: 0; border-block: 1px solid var(--line); }
  .totals div { display: grid; padding: 10px 0; min-width: 0; }
  .totals dt { order: 2; font-size: var(--fs-xs); color: var(--muted); font-stretch: var(--narrow); }
  .totals dd { margin: 0; font-size: 1.5rem; font-weight: 600; font-stretch: 80%; font-variant-numeric: tabular-nums; line-height: 1.15; white-space: nowrap; }
  .totals .alert dd { color: var(--critical); }
  @media (max-width: 759.98px) { .totals { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  /* decisions: what waits on the user, each row a link to its page */
  .ask { display: grid; gap: 3px; padding: 13px 14px 13px 13px; border-left: 4px solid var(--line); color: inherit; text-decoration: none; }
  .ask:first-child { border-top-left-radius: 9px; }
  .ask:last-child { border-bottom-left-radius: 9px; }
  .ask + .ask { border-top: 1px solid var(--line); }
  .ask:hover { background: color-mix(in srgb, var(--card-2) 55%, transparent); }
  .ask.open { border-left-color: var(--you); }
  .ask.held { border-left-color: var(--run); }
  .seg { display: inline-flex; margin: 0 0 10px; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-2); max-width: 100%; overflow-x: auto; }
  .seg button { min-height: var(--tap); padding: 0 12px; border: 0; border-radius: 7px; background: none; color: var(--muted); font: inherit; font-size: var(--fs-s); font-weight: 600; cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 14%, transparent); }
  .seg .n { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
  .ask.open.blocking { border-left-color: var(--critical); }
  .ask.closed { color: var(--muted); }
  .ask-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .ask-head b { font-weight: 700; font-stretch: var(--narrow); font-size: 1.0625rem; overflow-wrap: anywhere; margin-right: 2px; }
  .ask.closed .ask-head b { font-weight: 600; }
  .ask .detail { overflow-wrap: anywhere; }
  .ask .meta { font-size: var(--fs-s); color: var(--muted); overflow-wrap: anywhere; }

  /* the plan's usage: one meter per window */
  .usage { display: grid; gap: 14px; padding: 14px; }
  .usage-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
  .usage-row b { font-stretch: var(--narrow); }
  .usage-row .figure { font-weight: 600; font-stretch: var(--narrow); font-variant-numeric: tabular-nums; }
  .usage-row.warning .figure { color: var(--warning); }
  .usage-row.critical .figure { color: var(--critical); }
  .meter { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--card-2); overflow: hidden; }
  .meter span { display: block; height: 100%; min-width: 2px; border-radius: 4px; background: var(--accent); }
  .usage-row.warning .meter span { background: var(--warning); }
  .usage-row.critical .meter span { background: var(--critical); }
  .usage-row .meta, .usage-note { grid-column: 1 / -1; font-size: var(--fs-s); color: var(--muted); }
  .usage-account { font-weight: 600; font-stretch: var(--narrow); overflow-wrap: anywhere; }
  .usage-other { font-size: var(--fs-s); color: var(--muted); overflow-wrap: anywhere; }

  /* a manager's fleets: one strip per coordinator */
  .strip { display: grid; gap: 3px; padding: 12px 14px 12px 13px; border-left: 4px solid var(--c, var(--line)); }
  .strip:first-child { border-top-left-radius: 9px; }
  .strip:last-child { border-bottom-left-radius: 9px; }
  .strip + .strip { border-top: 1px solid var(--line); }
  .strip-head { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
  .strip-head .who { font-size: 1.0625rem; font-weight: 700; }
  .strip .detail { overflow-wrap: anywhere; }
  .strip .meta { font-size: var(--fs-s); color: var(--muted); overflow-wrap: anywhere; }
  .strip .block-link { z-index: auto; }
  .up { display: inline-flex; align-items: center; gap: 4px; min-height: var(--tap); padding: 0 8px; border-radius: 6px; color: var(--muted); font-weight: 600; font-stretch: var(--narrow); font-size: var(--fs-s); text-decoration: none; white-space: nowrap; }
  .up:hover { color: var(--text); background: var(--card-2); }
  .up svg.i { width: 16px; height: 16px; }

  /* roadmap */
  .milestone { padding: 12px 14px; display: grid; gap: 8px; }
  .milestone + .milestone { border-top: 1px solid var(--line); }
  .milestone-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .milestone-head h3 { font-size: 1rem; }
  .steps { list-style: none; margin: 0 -8px; padding: 0; display: grid; gap: 2px; }
  .step { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: var(--tap); box-sizing: border-box; padding: 5px 8px; border-radius: 6px; border: 0; background: none; text-align: left; }
  button.step { cursor: pointer; }
  button.step:hover { background: var(--card-2); }
  .step.current { background: var(--run-soft); }
  .step .dot { width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--faint); justify-self: center; }
  .step.done .dot { background: var(--good); border-color: var(--good); }
  .step.current .dot { background: var(--run); border-color: var(--run); }
  .step.blocked .dot { background: var(--critical); border-color: var(--critical); }
  .step.done .title { color: var(--muted); }
  .step .by { font-size: var(--fs-s); font-weight: 600; font-stretch: var(--narrow); color: var(--muted); overflow-wrap: anywhere; }

  /* roadblocks */
  .block { position: relative; padding: 12px 14px 12px 13px; display: grid; gap: 3px; border-left: 4px solid var(--line); }
  .block:first-child { border-top-left-radius: 9px; }
  .block:last-child { border-bottom-left-radius: 9px; }
  .block + .block { border-top: 1px solid var(--line); }
  .block.critical { border-left-color: var(--critical); }
  .block.serious { border-left-color: var(--serious); }
  .block.warning { border-left-color: var(--warning); }
  .block.resolved { border-left-color: var(--good); color: var(--muted); }
  .block-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .block-head b, .block-title { font-weight: 700; font-stretch: var(--narrow); font-size: 1.0625rem; }
  .block-title { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
  /* The whole roadblock answers a tap on its title: the button's area stretches over the card. */
  .block-title::after { content: ""; position: absolute; inset: 0; }
  .block:has(.block-title):hover { background: color-mix(in srgb, var(--card-2) 55%, transparent); }
  .block .detail { overflow-wrap: anywhere; }
  .block .needs { font-size: var(--fs-s); }
  .block-link { position: relative; z-index: 1; justify-self: start; display: inline-flex; align-items: center; min-height: var(--tap); font-weight: 600; }
  .preview-workers, .preview-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; }
  .preview-workers li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: var(--tap); }
  .preview-workers label { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); cursor: pointer; font-weight: 600; }
  .preview-workers input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  .preview-list code, .preview-workers code { font-family: var(--mono); font-size: 0.8125rem; overflow-wrap: anywhere; }
  .preview-pre { margin: 4px 0 0; padding: 8px 10px; border-radius: 6px; background: var(--card-2); font-family: var(--mono); font-size: 0.8125rem; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16em; overflow: auto; }

  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters label { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-s); color: var(--muted); }
  .filters select, .filters input[type="search"] { background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; font-size: var(--fs-s); min-height: var(--tap); box-sizing: border-box; }
  .filters input[type="search"] { min-width: 14ch; }
  .filters select { max-width: 24ch; }
  .f-more { display: contents; }
  .f-toggle { display: none; }
  .filters .reset { background: none; border: none; color: var(--accent); cursor: pointer; padding: 4px 6px; font-size: var(--fs-s); font-weight: 600; min-height: var(--tap); }
  .count { font-size: var(--fs-s); color: var(--muted); margin-left: auto; }
  @media (max-width: 759.98px) {
    .filters { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .filters input[type="search"] { width: 100%; font-size: 16px; }
    .f-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); cursor: pointer; font-weight: 600; font-stretch: var(--narrow); }
    .f-toggle[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .f-on { min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; padding: 0 5px; }
    .f-more { display: none; grid-column: 1 / -1; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    .filters.open .f-more { display: grid; }
    .f-more label { display: grid; gap: 4px; min-width: 0; }
    .f-more select { width: 100%; min-width: 0; font-size: 16px; min-height: 44px; }
    .f-more .reset { grid-column: 1 / -1; justify-self: start; min-height: 44px; padding: 0 12px; margin-left: -12px; }
    .count { grid-column: 1 / -1; margin-left: 0; }
  }

  /* workers: a table where there is room, a strip per worker where there is not */
  .fleet-card { container: fleet / inline-size; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 0.9rem; }
  th { text-align: left; font-size: var(--fs-xs); color: var(--muted); font-weight: 600; font-stretch: var(--narrow); padding: 10px 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.row:last-child td, tr.detail:last-child td { border-bottom: none; }
  td.right, th.right { text-align: right; white-space: nowrap; }
  .agent-name { white-space: nowrap; }
  .task { max-width: 34ch; }
  .lane { font-family: var(--mono); font-size: 0.8125rem; color: var(--muted); overflow-wrap: anywhere; }
  td.lane { min-width: 20ch; }
  td.c-upd { white-space: nowrap; }
  .lane code { display: block; font-family: inherit; }
  .expand { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: var(--fs-xs); font-weight: 600; font-stretch: var(--narrow); color: var(--muted); white-space: nowrap; min-height: var(--tap); }
  .expand[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  tr.detail td { background: var(--card-2); padding: 12px 14px 14px 32px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .detail-grid h4, .sheet h3 { margin: 0 0 3px; font-size: var(--fs-s); color: var(--muted); }
  .detail-grid p { white-space: pre-wrap; max-width: 62ch; overflow-wrap: anywhere; }
  @media (max-width: 759.98px) { .detail-grid { grid-template-columns: 1fr; } }
  td[data-label]::before { display: none; }
  @container fleet (max-width: 719.98px) {
    table, tbody { display: block; min-width: 0; font-size: inherit; }
    thead { display: none; }
    tr.row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    tr.row:last-child { border-bottom: none; }
    tr.row:has(+ tr.detail) { border-bottom: none; }
    tr.row td { display: block; padding: 0; border: 0; min-width: 0; text-align: left; white-space: normal; }
    .c-name { order: 1; flex: 1 1 auto; } .c-status { order: 2; }
    .c-task { order: 3; flex: 1 0 100%; max-width: none; }
    .c-skill { order: 4; } .c-model { order: 5; } .c-tokens { order: 6; } .c-time { order: 7; }
    .c-skill, .c-model, .c-tokens, .c-time { font-size: var(--fs-s); font-stretch: var(--narrow); color: var(--muted); }
    td[data-label]::before { display: inline; content: attr(data-label) " "; color: var(--faint); }
    td.c-lane { order: 8; flex: 1 0 100%; min-width: 0; } .c-lane:has(.faint) { display: none !important; }
    .c-upd { order: 9; flex: 1 1 auto; font-size: var(--fs-s); } .c-act { order: 10; }
    .agent-name { white-space: normal; overflow-wrap: anywhere; font-size: 1.0625rem; font-weight: 700; }
    tr.detail { display: block; border-bottom: 1px solid var(--line); }
    tr.detail:last-child { border-bottom: none; }
    tr.detail td { display: block; padding: 12px 14px 14px; border: 0; }
    .detail-grid { grid-template-columns: 1fr; }
  }

  /* token chart: one bar per worker, drawn in HTML so its text stays at reading size on a phone */
  .chart-card { padding: 14px; position: relative; container: chart / inline-size; }
  .chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; margin-bottom: 10px; font-size: var(--fs-s); }
  .bars { list-style: none; margin: 0; padding: 0; display: grid; }
  .bar-row, .bar-axis { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 11ch; gap: 0 10px; align-items: center; }
  .bar-row { min-height: 32px; border-radius: 5px; }
  .bar-row .who { justify-self: end; max-width: 100%; overflow: hidden; }
  .bar-row .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { position: relative; height: 100%; min-height: 28px; background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 25%); background-size: calc(100% - 1px) 100%; background-repeat: no-repeat; border-right: 1px solid var(--line); }
  .bar { position: absolute; left: 0; top: 50%; height: 16px; transform: translateY(-50%); border-radius: 3px; background: var(--c); min-width: 2px; }
  .bar-row:hover .bar, .bar-row:focus-within .bar { opacity: 0.8; }
  .bar-val { font-stretch: var(--narrow); font-variant-numeric: tabular-nums; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }
  .bar-axis .ticks { position: relative; height: 22px; }
  .bar-axis .ticks span { position: absolute; top: 4px; transform: translateX(-50%); font-stretch: var(--narrow); font-variant-numeric: tabular-nums; font-size: var(--fs-xs); color: var(--muted); }
  .bar-axis .ticks span:first-child { transform: none; }
  .bar-axis .ticks span:last-child { transform: translateX(-100%); }
  @container chart (max-width: 520px) {
    .bar-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who val" "track track"; padding-bottom: 6px; }
    .bar-row .who { grid-area: who; justify-self: start; }
    .bar-row .track { grid-area: track; min-height: 18px; }
    .bar-row .bar { height: 12px; }
    .bar-row .bar-val { grid-area: val; }
    .bar-axis { grid-template-columns: minmax(0, 1fr); }
    .bar-axis > :not(.ticks) { display: none; }
  }
  .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: var(--fs-s); white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); z-index: 2; }
  .tip .num { color: inherit; }

  /* the log: a time, what happened, who, and the words */
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .log li:last-child { border-bottom: none; }
  .log time { font-stretch: var(--narrow); font-variant-numeric: tabular-nums; font-size: var(--fs-xs); color: var(--muted); padding-top: 3px; white-space: nowrap; }
  .log .log-meta { display: inline; }
  .log .by { font-weight: 600; font-stretch: var(--narrow); margin-right: 6px; color: var(--muted); }
  .log .who { min-height: 0; vertical-align: baseline; margin-right: 2px; color: var(--muted); }
  .kind { display: inline-block; font-size: var(--fs-xs); font-weight: 700; font-stretch: var(--narrow); color: var(--muted); margin-right: 8px; }
  .kind::first-letter { text-transform: uppercase; }
  .kind.blocked { color: var(--critical); }
  .kind.asked { color: var(--you); }
  .kind.resolved, .kind.integrated { color: var(--good); }
  .kind.decision, .kind.message { color: var(--accent); }
  @media (max-width: 759.98px) {
    .log li { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 10px 14px; }
    .log time { padding: 0; }
    .log .log-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px; min-height: 30px; }
  }

  .foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: var(--muted); font-size: var(--fs-s); }
  .error { padding: 16px; margin: 16px; border: 1px solid var(--critical); border-radius: 10px; color: var(--critical); }
  @media (prefers-reduced-motion: no-preference) { .step, .expand, .who, .ask, .tabs a, .tabs button { transition: background-color 150ms ease, color 150ms ease; } }

  /* notifications */
  .bell { position: relative; width: 44px; height: 44px; margin-right: -8px; border-radius: 8px; border: 0; background: none; color: var(--text); cursor: pointer; display: grid; place-items: center; }
  .bell:hover, .bell[aria-expanded="true"] { background: var(--card-2); }
  .bell svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bell .badge { position: absolute; top: 2px; right: 0; background: var(--critical); }
  .bell.muted::after { content: ""; position: absolute; width: 26px; height: 2px; background: var(--muted); transform: rotate(-45deg); }
  .panel { position: absolute; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) - 2px); right: max(12px, calc(var(--gutter) - 8px)); z-index: 40; width: min(400px, calc(100% - 24px)); max-height: min(70dvh, 600px); display: grid; grid-template-rows: auto auto 1fr; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { font-size: 1rem; }
  .panel-head .actions { display: flex; gap: 4px; }
  .panel-head button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: var(--fs-xs); font-weight: 600; font-stretch: var(--narrow); color: var(--muted); cursor: pointer; min-height: var(--tap); }
  /* The settings sit behind the gear; folded, one muted line says them and opens them. */
  .panel-head button.gear { display: grid; place-items: center; width: var(--tap); padding: 0; }
  .panel-head .gear svg.i { width: 18px; height: 18px; }
  .panel-head .gear[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .panel-summary { display: block; width: 100%; padding: 6px 12px; border: 0; border-bottom: 1px solid var(--line); background: var(--card-2); color: var(--muted); font-size: var(--fs-xs); font-stretch: var(--narrow); text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-summary:hover { color: var(--text); }
  .panel-prefs { display: grid; gap: 4px; padding: 6px 12px 8px; border-bottom: 1px solid var(--line); background: var(--card-2); font-size: var(--fs-xs); color: var(--muted); }
  .pref { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) auto; align-items: center; gap: 8px; }
  .pref-name { font-weight: 600; font-stretch: var(--narrow); }
  .pref .seg { margin: 0; justify-self: start; }
  .seg.small { padding: 2px; border-radius: 8px; }
  .seg.small button { min-height: calc(var(--tap) - 6px); padding: 0 9px; border-radius: 6px; font-size: var(--fs-xs); }
  .seg button:disabled { opacity: 0.45; cursor: not-allowed; }
  .pref .icon-btn.test { width: var(--tap); height: var(--tap); }
  .pref .icon-btn.test svg.i { width: 18px; height: 18px; }
  .panel-prefs .blocked { color: var(--warning); }
  .notifs { list-style: none; margin: 0; padding: 0; overflow-y: auto; overscroll-behavior: contain; }
  .notifs li { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: var(--fs-s); align-items: start; overflow-wrap: anywhere; }
  .notifs li:last-child { border-bottom: none; }
  .notifs .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; margin-top: 8px; }
  .notifs li.unread .dot { background: var(--accent); }
  .notifs li.important .dot { background: var(--critical); }
  .notifs li.important.read .dot { background: color-mix(in srgb, var(--critical) 40%, transparent); }
  .notifs .meta, .toast .meta { font-size: var(--fs-xs); color: var(--muted); font-stretch: var(--narrow); }
  .notifs time { font-size: var(--fs-xs); color: var(--muted); font-stretch: var(--narrow); font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 2px; }
  .notifs .empty { display: block; padding: 18px 12px; }
  @media (max-width: 759.98px) {
    .panel { right: 8px; left: 8px; width: auto; max-height: calc(100dvh - var(--top-h) - var(--dock-h) - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px) - 16px); }
    .pref { grid-template-columns: 5.5em minmax(0, 1fr) auto; gap: 6px; }
    .panel-head button { padding: 0 12px; }
  }
  .toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 32; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); }
  .toast { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px 12px 10px 11px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); box-shadow: var(--shadow); font-size: var(--fs-s); overflow-wrap: anywhere; }
  .toast.opens { cursor: pointer; }
  .toast.important { border-left-color: var(--critical); }
  .toast.important .kind { color: var(--critical); }
  .toast .text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .toast .more { margin-top: 2px; font-size: var(--fs-xs); font-weight: 700; font-stretch: var(--narrow); color: var(--muted); }
  .toast button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; line-height: 1; padding: 0 2px; align-self: start; min-width: var(--tap); min-height: var(--tap); margin: -8px -8px -8px 0; }
  /* On a phone the toasts come in under the masthead, clear of the thumb and of what it is about to press. */
  @media (max-width: 759.98px) {
    .toasts { top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 8px); bottom: auto; left: 8px; right: 8px; width: auto; }
    .toast .text { -webkit-line-clamp: 2; line-clamp: 2; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .toast { animation: toast-in 180ms ease-out; }
    @keyframes toast-in { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
  }

  /* the worker sheet: a worker's detail, opened from its name anywhere on the page */
  dialog.sheet { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--card); color: var(--text); width: min(600px, calc(100vw - 32px)); max-height: min(85dvh, 760px); box-shadow: var(--shadow); overflow: hidden; }
  dialog.sheet::backdrop { background: rgb(10 16 13 / 0.5); }
  .sheet-in { display: grid; gap: 14px; padding: 16px 18px 18px; max-height: inherit; overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box; }
  .sheet-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
  .sheet-head .swatch { width: 14px; height: 14px; border-radius: 3px; }
  .sheet-head h2 { font-size: 1.375rem; overflow-wrap: anywhere; }
  .icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 8px; border: 0; background: none; color: var(--muted); cursor: pointer; flex: none; }
  .icon-btn:hover { background: var(--card-2); color: var(--text); }
  .refused dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 10px 0 0; }
  .refused dt { font-size: var(--fs-xs); color: var(--muted); font-stretch: var(--narrow); }
  .refused dd { margin: 0; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px 14px; margin: 0; padding: 10px 0; border-block: 1px solid var(--line); }
  .facts div { min-width: 0; }
  .facts dt { font-size: var(--fs-xs); color: var(--muted); font-stretch: var(--narrow); }
  .facts dd { margin: 0; font-weight: 600; font-stretch: var(--narrow); overflow-wrap: anywhere; }
  .sheet p { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 65ch; }
  .sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; font-stretch: var(--narrow); }
  .btn:hover { border-color: var(--faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text)); }
  .btn.danger { border-color: var(--critical); color: var(--critical); }
  .btn.danger:hover { background: var(--critical-soft); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  @media (max-width: 759.98px) {
    dialog.sheet { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 16px 16px 0 0; border-bottom: 0; max-height: 88dvh; }
    .sheet-in { padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
    .sheet-actions .btn { flex: 1; justify-content: center; }
  }
  @media (prefers-reduced-motion: no-preference) and (max-width: 759.98px) {
    dialog.sheet[open] { animation: rise 200ms ease-out; }
  }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* the decision's page: what the user needs to decide, and the control to answer */
  .dv { max-width: 820px; gap: 20px; }
  .dv:focus { outline: none; }
  .dv-back { justify-self: start; display: inline-flex; align-items: center; gap: 4px; min-height: var(--tap); margin: -6px 0 -10px -6px; padding: 0 8px 0 2px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 600; font-stretch: var(--narrow); }
  .dv-back:hover { color: var(--text); background: var(--card-2); }
  .dv-back svg.i { width: 20px; height: 20px; }
  .dv-info, .dv-answer { display: grid; gap: 18px; min-width: 0; }
  .dv-head { display: grid; gap: 8px; }
  .dv-head h1 { font-size: 1rem; color: var(--muted); }
  .dv-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .dv-meta { color: var(--muted); font-size: var(--fs-s); overflow-wrap: anywhere; }
  .dv-meta .who { min-height: 0; vertical-align: baseline; }
  .dv-question { font-size: clamp(1.5rem, 1.2rem + 1.6vw, 2rem); font-weight: 700; font-stretch: 80%; line-height: 1.12; letter-spacing: -0.005em; max-width: 26ch; text-wrap: balance; overflow-wrap: anywhere; }
  .dv-block { display: grid; gap: 3px; min-width: 0; }
  .dv-block h3, .note h3, .dv-form legend, .dv-body h2 { font-size: var(--fs-s); color: var(--muted); }
  .dv-block p, .note p { max-width: 68ch; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note { display: grid; gap: 3px; padding: 12px 14px 12px 13px; border-radius: 10px; background: var(--card-2); border-left: 4px solid var(--faint); min-width: 0; }
  .note.changed { border-left-color: var(--you); background: var(--you-soft); }
  .note.decided { border-left-color: var(--good); }
  .note.pending { border-left-color: var(--accent); background: var(--accent-soft); }
  .note.held, .note.recording { border-left-color: var(--accent); }
  .note .by { font-weight: 600; font-stretch: var(--narrow); color: var(--muted); }
  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .option { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: start; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  label.option { cursor: pointer; }
  label.option:hover { border-color: var(--faint); }
  .option:has(input:checked), .option.chosen { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .option input { accent-color: var(--accent); width: 20px; height: 20px; margin: 2px 0 0; }
  .option .key { font-weight: 700; font-stretch: var(--narrow); color: var(--muted); min-width: 20px; }
  .option .label { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-weight: 700; font-stretch: var(--narrow); font-size: 1.0625rem; overflow-wrap: anywhere; }
  .option .consequence { grid-column: 2; color: var(--muted); overflow-wrap: anywhere; }
  .dv-form { display: grid; gap: 14px; min-width: 0; }
  .dv-form fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 8px; }
  .dv-form legend { padding: 0; margin-bottom: 8px; font-weight: 700; font-stretch: var(--narrow); }
  .field { display: grid; gap: 4px; font-size: var(--fs-s); font-weight: 600; font-stretch: var(--narrow); color: var(--muted); }
  .field textarea, .field input { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font-size: 16px; font-weight: 400; font-stretch: 100%; line-height: 1.45; }
  .field textarea { field-sizing: content; min-block-size: calc(2lh + 22px); max-block-size: 40dvh; resize: vertical; }
  .field input { font-family: var(--mono); font-size: 15px; }
  .field textarea:focus-visible, .field input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent); }
  .manual { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--card-2); font-family: var(--mono); font-size: 0.8125rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dv code { font-family: var(--mono); font-size: 0.88em; padding: 1px 5px; border-radius: 4px; background: var(--card-2); }

  /* Free text in the page's format (src/text.ts): paragraphs, inline code, and code blocks. A block is
     its language, a wrap switch and a copy button over the code, which scrolls sideways inside the block
     (never the page) unless wrapped. The colours are the page's own tokens, so both themes follow. */
  .rich { display: grid; gap: 0.6em; min-width: 0; }
  .rich > p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .rich code.ic { font-family: var(--mono); font-size: 0.86em; padding: 1px 5px; border-radius: 4px; background: color-mix(in srgb, var(--text) 8%, transparent); overflow-wrap: anywhere; }
  .code { margin: 0; min-width: 0; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--card-2); overflow: hidden; font-size: 1rem; font-weight: 400; font-stretch: 100%; line-height: 1.5; letter-spacing: 0; text-wrap: initial; }
  .code-head { display: flex; align-items: center; gap: 2px; padding-left: 12px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--text) 4%, var(--card-2)); }
  .code-lang { flex: 1; min-width: 0; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
  .code-head button { min-width: var(--tap); min-height: var(--tap); padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600; font-stretch: var(--narrow); cursor: pointer; }
  .code-head button:hover { background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text); }
  .code-head .code-copy { color: var(--accent); }
  .code-head .code-wrap[aria-pressed="true"] { color: var(--text); background: color-mix(in srgb, var(--text) 10%, transparent); }
  .code-pre { margin: 0; padding: 10px 12px; overflow-x: auto; overscroll-behavior-x: contain; font-family: var(--mono); font-size: 0.8125rem; line-height: 1.55; white-space: pre; tab-size: 4; color: var(--text); }
  .code-pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
  .code-pre:focus-visible { outline-offset: -2px; }
  .code-pre code { font: inherit; padding: 0; background: none; }
  .t-comment { color: var(--muted); font-style: italic; }
  .t-command, .t-heading { color: var(--text); font-weight: 600; }
  .t-keyword, .t-selector { color: var(--s7); }
  .t-attr, .t-meta { color: var(--you); }
  .t-variable, .t-function { color: var(--run); }
  .t-property, .t-tag { color: var(--critical); }
  .t-string, .t-inserted { color: var(--good); }
  .t-number, .t-literal { color: var(--serious); }
  .t-type { color: var(--accent); }
  .t-operator { color: var(--muted); }
  .t-deleted { color: var(--critical); }
  .t-link { color: var(--accent); text-decoration: underline; }
  .msg .code { margin: 2px 0; background: color-mix(in srgb, var(--card) 70%, transparent); }
  .dv-body { display: grid; gap: 8px; }
  .dv-body iframe { display: block; width: 100%; height: 160px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .dv-body iframe.fixed { height: 70dvh; }
  .dv-queue { display: grid; gap: 10px; }
  .dv-queue-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .dv-queue .btn[aria-disabled] { color: var(--faint); cursor: default; }
  .dv-queue-row .switch { margin-left: auto; }
  .dv-fleet { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: -10px; }
  .dv-embed { display: block; width: 100%; height: 70dvh; border: 0; background: transparent; }
  html.embed .dv { max-width: none; padding: 2px 2px 8px; }
  /* On a phone the way to answer stays under the thumb while the page scrolls above it. */
  @media (max-width: 759.98px) {
    .dv .sheet-actions .btn { flex: 1; justify-content: center; }
    .dv-form > .sheet-actions:first-of-type { position: sticky; bottom: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px)); z-index: 2; margin: 0 -16px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 94%, transparent); border-top: 1px solid var(--line); }
  }

  /* chat: docked beside the page on a wide screen, a full-height view over it elsewhere */
  .chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--card); color: var(--text); }
  .chat-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; border-bottom: 1px solid var(--line); flex: none; min-height: var(--top-h); box-sizing: border-box; }
  .chat-head h2 { font-size: 1.1875rem; }
  .you { font-size: var(--fs-xs); color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
  .chat-head h2:focus { outline: none; }
  .chat-head h2:focus-visible { outline: 2px solid var(--accent); }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--muted); margin-right: auto; }
  .conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .conn[data-conn="live"]::before { background: var(--good); }
  .conn[data-conn="reconnecting"]::before, .conn[data-conn="connecting"]::before { background: var(--warning); }
  .chat-note { margin: 14px 16px 0; padding: 12px 14px; border-radius: 10px; background: var(--card-2); color: var(--muted); font-size: var(--fs-s); }
  /* The switch for decision activity, on a row of its own under the chat's head (it lines up with the tabs). */
  .chat-tools { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-height: 44px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line); flex: none; box-sizing: border-box; }
  .hidden-note { margin-right: auto; min-width: 0; font-size: var(--fs-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--muted); font: inherit; font-size: var(--fs-s); font-weight: 600; font-stretch: var(--narrow); white-space: nowrap; cursor: pointer; }
  .switch:hover { color: var(--text); background: var(--card-2); }
  .switch-track { position: relative; width: 30px; height: 18px; border-radius: 9px; background: var(--line); flex: none; }
  .switch-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgb(0 0 0 / 0.25); }
  .switch[aria-checked="true"] { color: var(--text); }
  .switch[aria-checked="true"] .switch-track { background: var(--accent); }
  .switch[aria-checked="true"] .switch-track::after { left: 14px; background: var(--on-accent); }
  /* The conversation, a messenger's: the viewer on the right in the accent's tint, the fleet on the left
     under each sender's name and colour; a run of one sender is one name and time, its bubbles stacked. */
  .chat-log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; list-style: none; margin: 0; padding: 6px 12px 10px; display: flex; flex-direction: column; gap: 3px; }
  .day { align-self: center; margin: 14px 0 4px; padding: 2px 12px; border-radius: 999px; background: var(--card-2); color: var(--muted); font-size: var(--fs-xs); font-weight: 600; font-stretch: var(--narrow); }
  .turn { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .turn.from-user { align-items: flex-end; }
  .turn.head { margin-top: 10px; }
  .turn-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-height: 28px; padding: 0 6px; font-size: var(--fs-xs); }
  .turn-head .who { margin-block: calc((28px - var(--tap)) / 2); }
  .turn-head .name { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-stretch: var(--narrow); }
  .from-fleet .turn-head .name::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--faint)); }
  .turn-head .who, .turn-head .name { color: color-mix(in srgb, var(--c, var(--text)) 55%, var(--text)); font-size: var(--fs-s); }
  .turn-head time { color: var(--muted); font-stretch: var(--narrow); font-variant-numeric: tabular-nums; }
  .turn-row { display: flex; align-items: center; gap: 2px; width: 100%; min-width: 0; }
  .from-user .turn-row { justify-content: flex-end; }
  .msg { position: relative; max-width: 80%; min-width: 0; box-sizing: border-box; padding: 7px 12px 8px; border-radius: 18px; background: var(--card-2); overflow-wrap: anywhere; }
  .from-user .msg { background: color-mix(in srgb, var(--accent) 24%, var(--card)); }
  .from-fleet:not(.head) .msg { border-top-left-radius: 6px; }
  .from-fleet:not(.tail) .msg { border-bottom-left-radius: 6px; }
  .from-user:not(.head) .msg { border-top-right-radius: 6px; }
  .from-user:not(.tail) .msg { border-bottom-right-radius: 6px; }
  .msg.can-reply { cursor: pointer; }
  .msg.replying, .found { outline: 2px solid var(--accent); outline-offset: 2px; }
  .msg-text { margin: 0; white-space: pre-wrap; }
  .msg-text.rich { gap: 0.45em; }
  /* What a reply answers, on one line in the answered sender's colour; a tap shows it. */
  .re-line { display: grid; justify-items: start; width: 100%; min-width: 0; min-height: var(--tap); box-sizing: border-box; margin: 1px 0 6px; padding: 3px 10px 4px; border: 0; border-left: 3px solid var(--c, var(--faint)); border-radius: 6px; background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--muted); font: inherit; font-size: var(--fs-xs); line-height: 1.35; text-align: left; cursor: pointer; }
  .re-line b { font-weight: 700; font-stretch: var(--narrow); color: color-mix(in srgb, var(--c, var(--text)) 55%, var(--text)); }
  .re-line span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .re-line:hover { background: color-mix(in srgb, var(--text) 11%, transparent); }
  .msg-quote { margin: 2px 0 6px; padding: 4px 10px; border-left: 3px solid color-mix(in srgb, var(--text) 25%, transparent); color: var(--muted); font-size: var(--fs-s); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9.5em; overflow: auto; }
  .msg-quote .from { display: block; font-size: var(--fs-xs); font-weight: 600; }
  .msg-quote a.from { display: flex; align-items: center; min-height: var(--tap); color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 45%, transparent); text-underline-offset: 2px; }
  .msg-quote a.from:hover { color: var(--text); text-decoration-color: currentColor; }
  .reply-btn { flex: none; display: grid; place-items: center; width: var(--tap); height: var(--tap); padding: 0; border: 0; border-radius: 50%; background: none; color: var(--faint); cursor: pointer; }
  .reply-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .reply-btn:hover, .reply-btn:focus-visible { color: var(--accent); background: var(--card-2); }
  /* With a mouse the button shows on hover; on a touch screen, once per run (a tap on any bubble replies to it). */
  @media (hover: hover) and (pointer: fine) {
    .reply-btn { opacity: 0; }
    .turn:hover .reply-btn, .reply-btn:focus-visible, .msg.replying + .reply-btn { opacity: 1; }
  }
  @media (hover: none), (pointer: coarse) {
    .turn:not(.tail) .reply-btn { visibility: hidden; }
  }
  .wait { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 2px 6px; margin: 2px 6px 0; font-size: var(--fs-xs); color: var(--muted); }
  .wait.done { color: var(--faint); }
  .wait.unread { color: var(--you); font-weight: 600; }
  .wait .who { font-size: var(--fs-xs); padding: 0 8px; margin: 0; border-radius: 6px; background: var(--card); border: 1px solid var(--line); }
  .wait .chip { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 8px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); font-weight: 600; font-stretch: var(--narrow); }
  /* Decision activity, when shown: one line each, leading to the decision. */
  .dmark { margin: 6px 0 0; min-width: 0; }
  .dmark a { display: flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 10px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: var(--fs-xs); text-decoration: none; }
  .dmark a:hover { background: var(--card-2); }
  .dmark svg { width: 12px; height: 12px; flex: none; fill: var(--you); }
  .dmark-line { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dmark-who { font-weight: 600; color: var(--text); }
  .dmark .ref { color: var(--you); }
  .dmark time { flex: none; font-variant-numeric: tabular-nums; }
  .side-link { align-self: center; width: min(100%, 30rem); margin: 10px 0 0; }
  .side-link button { display: grid; gap: 1px; width: 100%; min-height: var(--tap); padding: 7px 12px 8px; border: 1px dashed var(--line); border-radius: 12px; background: var(--bg); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .side-link button:hover { border-color: var(--faint); }
  .side-kicker { color: var(--muted); font-size: var(--fs-xs); font-weight: 600; font-stretch: var(--narrow); }
  .side-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A decision's thread on its page: the same bubbles, on a card of their own. */
  .thread-list { list-style: none; margin: 4px 0 0; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .chat-empty { margin: auto 0; text-align: center; color: var(--muted); font-size: var(--fs-s); padding: 24px 8px; }
  .mention { display: inline; padding: 0 6px; border-radius: 4px; font-size: 0.94em; font-weight: 600; font-stretch: var(--narrow); white-space: nowrap; background: color-mix(in srgb, var(--c, var(--accent)) 18%, var(--card)); color: var(--text); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .deaf { margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; background: var(--you-soft); color: var(--text); font-size: var(--fs-s); }
  .composer { position: relative; flex: none; padding: 8px 12px max(12px, env(safe-area-inset-bottom, 0px)); background: var(--card); }
  .chat-error { margin: 0 4px 8px; padding: 9px 12px; border-radius: 8px; background: var(--critical-soft); color: var(--critical); font-size: var(--fs-s); }
  .dv .chat-error { margin: 0; }
  /* The composer: one rounded surface holding the reply chip, the field (one line to eight, then it
     scrolls) and the round send button at its bottom right. The focus ring is the surface's. */
  .box { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "chip chip" "text send"; align-items: end; row-gap: 6px; column-gap: 6px; padding: 6px 6px 6px 14px; border: 1px solid var(--line); border-radius: 22px; background: var(--bg); cursor: text; }
  .box:has(.reply[hidden]) { row-gap: 0; }
  .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent); }
  .box textarea { grid-area: text; display: block; width: 100%; min-width: 0; margin: 0; padding: 7px 0; border: 0; background: none; font-size: 16px; line-height: 1.45; field-sizing: content; min-block-size: calc(1lh + 14px); max-block-size: calc(8lh + 14px); overflow-y: auto; resize: none; box-sizing: border-box; outline: none; }
  .box textarea::placeholder { color: var(--faint); opacity: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box textarea:focus-visible { outline: none; }
  .box textarea:disabled { cursor: not-allowed; }
  .send { grid-area: send; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  .send svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .send:disabled { background: var(--line); color: var(--muted); cursor: default; }
  @media (max-width: 759.98px), (pointer: coarse) { .send { width: 44px; height: 44px; } .box { border-radius: 26px; padding-left: 16px; } }
  .reply { grid-area: chip; display: flex; align-items: center; gap: 4px; justify-self: start; max-width: 100%; min-width: 0; box-sizing: border-box; padding: 0 0 0 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: var(--fs-xs); margin-top: 2px; }
  .reply-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .reply .icon-btn { width: var(--tap); height: var(--tap); color: inherit; font-size: 1rem; }
  .deaf-line { color: var(--you); font-weight: 600; }
  td.silent { color: var(--critical); font-weight: 600; }
  .dchip { display: inline-block; margin: 0 2px; padding: 0 6px; border-radius: 5px; font-family: var(--mono, "JetBrains Mono", monospace); font-size: 0.78em; font-weight: 700; text-decoration: none; background: var(--card-2); color: var(--muted); vertical-align: 1px; }
  .dchip.open { background: var(--you-soft); color: var(--you); }
  .dchip.held { background: var(--run-soft); color: var(--run); }
  .dv-origin a { color: inherit; }
  .steps li.with-chips { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .steps li.with-chips .step-chips { grid-column: 2; grid-row: 1; padding-right: 4px; }
  .steps li.with-chips > .step { grid-column: 1; grid-row: 1; }
  .stuck { margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; border-left: 4px solid var(--critical); background: color-mix(in srgb, var(--critical) 9%, var(--card)); }
  .stuck h3 { margin: 0 0 4px; font-size: var(--fs-s); color: var(--critical); }
  .stuck ul { margin: 0; padding-left: 18px; }
  .stuck li { margin: 2px 0; }
  .switch select { max-width: 42vw; min-height: var(--tap); padding: 0 28px 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; font-size: var(--fs-s); font-weight: 600; text-overflow: ellipsis; }
  dialog.finder { width: min(680px, calc(100vw - 32px)); margin-top: 10vh; }
  .finder-in { display: flex; flex-direction: column; max-height: min(75dvh, 640px); }
  .find-bar { flex: none; display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  #find-q { flex: 1; min-width: 0; margin: 0; padding: 14px 16px; border: 0; background: none; color: var(--text); font: inherit; font-size: 1.0625rem; outline: none; }
  #find-q::-webkit-search-cancel-button { display: none; }
  .find-x { display: none; }
  /* The kinds, as the page's segmented control; Tab cycles them from the field, so they take no focus of their own. */
  .find-tabs { flex: none; display: flex; gap: 2px; margin: 8px 12px 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-2); overflow-x: auto; scrollbar-width: none; align-self: flex-start; max-width: calc(100% - 24px); box-sizing: border-box; }
  .find-tabs::-webkit-scrollbar { display: none; }
  .find-tabs button { flex: none; min-height: 28px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--muted); font: inherit; font-size: var(--fs-s); font-weight: 600; font-stretch: var(--narrow); cursor: pointer; white-space: nowrap; transition: transform 120ms ease-out; }
  .find-tabs button:active { transform: scale(0.97); }
  .find-tabs button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 14%, transparent); }
  .find-list { margin: 0; padding: 4px 0 8px; overflow: auto; overscroll-behavior: contain; }
  .find-group { position: sticky; top: 0; z-index: 1; padding: 10px 16px 4px; background: var(--card); font-size: var(--fs-xs); font-weight: 700; color: var(--muted); }
  .find-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; padding: 8px 16px 8px 13px; cursor: pointer; border-left: 3px solid transparent; }
  .find-row[aria-selected="true"], .find-more[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
  .find-row:active, .find-more:active { background: var(--accent-soft); }
