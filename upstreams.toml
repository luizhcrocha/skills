# Upstreams tstack adapts. `just sync-upstream` (scripts/sync_upstream.py)
# reads this file; see the docstring there for the full semantics.
#
# Per upstream, under [upstream.<name>]:
#   url     git URL to clone
#   subdir  optional directory inside the upstream repo; `from` paths are relative to it
#   branch  optional branch (default: the remote's default branch)
#   base    upstream commit last synced; the 3-way merge base. The sync rewrites
#           it after a run with no conflicts. Merge a new mapping from this commit.
#   map     [{ from, to }]: only mapped paths sync. `from` is an upstream path
#           pattern (`*` within a segment, `**` across segments) matching a file
#           or a leading directory of it (the rest of the path is appended to
#           `to`); `{1}`, `{2}`... in `to` take what the wildcards matched. First
#           match wins. Examples:
#             { from = "skills/tdd", to = "skills/engineering/test-strategy" }            # dir -> dir
#             { from = "skills/tdd/SKILL.md", to = "skills/engineering/test-strategy/pstack-tdd.md" }  # file -> file
#             { from = "skills/principle-*/SKILL.md", to = "skills/engineering/principles/{1}.md" }   # glob
#   units   patterns naming the units unmapped content is reported by
#           (default: the top-level entry)
#   ignore  patterns never reported as unmapped (decided: not wanted)
#   watch   true: read for ideas, never copied (no map allowed). The report lists
#           commits and changed files since `base`; `--diff` prints the diff.

[upstream.mattpocock]
url = "https://github.com/mattpocock/skills.git"
base = "c55ee46073ed923f86ce59a5eb3b6d895095d1b7"
units = ["skills/*/*"]
# Repo plumbing, and bucket READMEs (ours, per CLAUDE.md), are never synced.
ignore = [
  ".*", "AGENTS.md", "CHANGELOG.md", "CLAUDE.md", "LICENSE", "README.md",
  "docs", "package.json", "package-lock.json", "scripts", "skills/*/README.md",
]
map = [
  { from = "skills/engineering/code-review", to = "skills/engineering/code-review" },
  { from = "skills/engineering/codebase-design", to = "skills/engineering/codebase-design" },
  { from = "skills/engineering/diagnosing-bugs", to = "skills/engineering/diagnosing-bugs" },
  { from = "skills/engineering/domain-modeling", to = "skills/engineering/domain-modeling" },
  { from = "skills/engineering/grill-with-docs", to = "skills/engineering/grill-with-docs" },
  { from = "skills/engineering/implement", to = "skills/engineering/implement" },
  { from = "skills/engineering/improve-codebase-architecture", to = "skills/engineering/improve-codebase-architecture" },
  { from = "skills/engineering/prototype", to = "skills/engineering/prototype" },
  { from = "skills/engineering/research", to = "skills/engineering/research" },
  { from = "skills/engineering/tdd", to = "skills/engineering/tdd" },
  { from = "skills/engineering/to-spec", to = "skills/engineering/to-spec" },
  { from = "skills/engineering/triage", to = "skills/engineering/triage" },
  { from = "skills/engineering/wizard", to = "skills/engineering/wizard" },
  { from = "skills/productivity/grill-me", to = "skills/productivity/grill-me" },
  { from = "skills/productivity/grilling", to = "skills/productivity/grilling" },
  { from = "skills/productivity/handoff", to = "skills/productivity/handoff" },
  { from = "skills/productivity/teach", to = "skills/productivity/teach" },
  { from = "skills/productivity/wait-what", to = "skills/productivity/wait-what" },
  { from = "skills/productivity/writing-for-agents", to = "skills/productivity/writing-for-agents" },
]

# poteto's pstack (MIT). Each overlap is decided with Luiz (docs/tstack-plan.md,
# step 4) and gets its mapping then. The principles are adapted in place
# (Cursor-only references, links between leaves); those local edits 3-way merge
# on the next sync.
[upstream.pstack]
url = "https://github.com/cursor/plugins.git"
subdir = "pstack"
base = "2eb7ed4613cfc8f098dfe464a23680ea44d84c5e"
units = ["skills/*", "agents/*", "automations/*"]
ignore = []
map = [
  { from = "skills/principle-*/SKILL.md", to = "skills/engineering/principles/{1}.md" },
  # watch-pr, unchanged: the babysit and shipping playbooks poll GitHub with it (bun).
  { from = "skills/poteto-mode/scripts/watch-pr", to = "skills/engineering/tuca-mode/scripts/watch-pr" },
  { from = "skills/poteto-mode/scripts/bootstrap.ts", to = "skills/engineering/tuca-mode/scripts/bootstrap.ts" },
  { from = "skills/poteto-mode/scripts/package.json", to = "skills/engineering/tuca-mode/scripts/package.json" },
  { from = "skills/poteto-mode/scripts/bun.lock", to = "skills/engineering/tuca-mode/scripts/bun.lock" },
]

# OptMem and its per-project fork: the ideas behind memo (docs/design/memo.md).
# Neither has a license, so they are watch-only: `just sync-upstream` lists what
# changed since `base` (`--diff` shows it) and never copies a file; anything
# worth having is reimplemented in scripts/memo. `base` is the commit memo was
# designed from (2026-09-30); a real run moves it to what the report showed.
[upstream.optmem]
url = "https://github.com/VictorTaelin/OptMem.git"
base = "1fb164cf39028047781f72ac3bb1e5a691c1dcb0"
watch = true

[upstream.optmem-split]
url = "https://github.com/texarkanine/OptMem-Split.git"
branch = "main.split"
base = "72f4149d48187f641e3b5bc9bbba7a2dd15f4df0"
watch = true
